<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#4f7cff" />
  <title>毎朝日記</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>毎朝日記</h1>
    <span id="today-date"></span>
  </header>

  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="record">記録する</button>
    <button class="tab-btn" data-tab="history">履歴</button>
  </nav>

  <!-- 記録タブ -->
  <section id="tab-record" class="tab-content active">
    <div class="camera-area">
      <video id="camera-video" autoplay playsinline></video>
      <canvas id="camera-canvas" hidden></canvas>
      <img id="photo-preview" alt="撮影した写真" hidden />
      <div class="camera-controls">
        <button id="btn-start-camera" class="btn-primary">カメラを起動</button>
        <button id="btn-capture" class="btn-capture" hidden>📷 撮影</button>
        <button id="btn-retake" class="btn-secondary" hidden>撮り直す</button>
      </div>
    </div>

    <div class="form-area">
      <label class="input-label" for="weight-input">
        体重 (kg)
      </label>
      <div class="weight-row">
        <button class="weight-adj" data-delta="-0.1">−</button>
        <input
          id="weight-input"
          type="number"
          step="0.1"
          min="0"
          max="300"
          placeholder="例: 65.5"
        />
        <button class="weight-adj" data-delta="+0.1">＋</button>
      </div>

      <label class="input-label" for="memo-input">メモ（任意）</label>
      <textarea id="memo-input" rows="3" placeholder="今日の一言…"></textarea>

      <button id="btn-save" class="btn-save">保存する</button>
    </div>

    <div id="save-toast" class="toast" hidden>保存しました！</div>
  </section>

  <!-- 履歴タブ -->
  <section id="tab-history" class="tab-content">
    <div id="history-empty" class="empty-state">
      <p>まだ記録がありません。<br />毎朝の記録を始めましょう！</p>
    </div>
    <ul id="history-list" class="history-list"></ul>
  </section>

  <!-- エントリ詳細モーダル -->
  <div id="detail-modal" class="modal" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-card">
      <button class="modal-close">✕</button>
      <p id="modal-date" class="modal-date"></p>
      <img id="modal-photo" alt="写真" />
      <p id="modal-weight" class="modal-weight"></p>
      <p id="modal-memo" class="modal-memo"></p>
      <button id="modal-delete" class="btn-delete">削除</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
