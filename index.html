<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ff7043" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="毎朝日記" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="manifest" href="manifest.json" />
  <title>毎朝日記</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ログイン画面 -->
  <div id="screen-login" class="screen active">
    <div class="login-wrap">
      <div class="login-icon">📖</div>
      <h1 class="login-title">DAILY JOURNAL</h1>
      <p class="login-subtitle">毎朝の記録</p>
      <div id="login-form-wrap">
        <p class="login-desc">メールアドレスを入力すると<br>6桁の確認コードをお送りします</p>
        <input id="login-email" type="email" inputmode="email" placeholder="メールアドレス" class="login-input" autocomplete="email" />
        <button id="btn-login" class="btn-primary login-btn">コードを送る</button>
      </div>
      <div id="login-otp-wrap" hidden>
        <p class="login-desc">✉️ コードを送信しました<br>メールに届いた6桁の数字を入力してください</p>
        <input id="login-otp" type="text" inputmode="numeric" maxlength="6" placeholder="000000" class="login-input login-otp-input" autocomplete="one-time-code" />
        <button id="btn-verify" class="btn-primary login-btn">ログイン</button>
        <button id="btn-resend" class="login-resend-btn">再送する</button>
      </div>
    </div>
  </div>

  <!-- 記録画面 -->
  <div id="screen-record" class="screen">
    <div class="header">
      <div class="header-sub" id="header-date"></div>
      <div class="header-title">DAILY JOURNAL <span style="font-size:0.5rem;opacity:0.6">v24</span></div>
    </div>

    <div class="body-scroll">
      <!-- 写真 -->
      <div class="section-label">今日の写真</div>
      <div class="photo-card">
        <div id="camera-placeholder" class="photo-placeholder">
          <span>🤳</span>
          <p>カメラを起動して撮影しよう</p>
        </div>
        <video id="camera-video" autoplay playsinline hidden></video>
        <canvas id="camera-canvas" hidden></canvas>
        <img id="photo-preview" alt="撮影した写真" hidden />
        <div class="camera-controls">
          <button id="btn-start-camera" class="btn-primary">📷 カメラを起動</button>
          <button id="btn-capture" class="btn-capture" hidden>シャッター</button>
          <button id="btn-retake" class="btn-secondary" hidden>撮り直す</button>
        </div>
      </div>

      <!-- 体重 -->
      <div class="section-label">体重</div>
      <div class="weight-card">
        <button class="weight-adj" data-delta="-0.1">−</button>
        <div class="weight-display">
          <input id="weight-input" type="number" step="0.1" min="0" max="300" placeholder="–" />
          <span class="weight-unit">kg</span>
        </div>
        <button class="weight-adj" data-delta="+0.1">＋</button>
      </div>

      <!-- コメント -->
      <div class="section-label">コメント</div>
      <div class="comment-card">
        <!-- 朝 -->
        <div class="entry-row">
          <div class="entry-header">
            <span class="comment-icon">🌅</span>
            <span class="comment-label">朝のひとこと</span>
          </div>
          <div class="entry-time">
            <span class="entry-time-icon">⏰</span>
            <input id="wake-input" type="time" class="time-inline" />
          </div>
        </div>
        <div class="comment-body">
          <textarea id="morning-input" rows="2" placeholder="今朝の気分は…"></textarea>
        </div>

        <div class="comment-divider"></div>

        <!-- 夜 -->
        <div class="entry-row">
          <div class="entry-header">
            <span class="comment-icon">🌙</span>
            <span class="comment-label">夜のひとこと</span>
          </div>
          <div class="entry-time">
            <span class="entry-time-icon">🛏</span>
            <input id="sleep-input" type="time" class="time-inline" />
          </div>
        </div>
        <div class="comment-body">
          <textarea id="evening-input" rows="2" placeholder="今日一日どうだった…"></textarea>
        </div>
      </div>

      <button id="btn-save" class="btn-save">保存する</button>
    </div>

    <div id="save-toast" class="toast" hidden></div>
  </div>

  <!-- 履歴画面 -->
  <div id="screen-history" class="screen">
    <div class="header">
      <div class="header-sub">これまでの記録</div>
      <div class="header-title-row">
        <div class="header-title">HISTORY</div>
        <button id="btn-view-toggle" class="btn-view-toggle">⊞</button>
      </div>
    </div>

    <div class="body-scroll">
      <div class="backup-bar">
        <button id="btn-export" class="btn-backup">📤 バックアップ</button>
        <button id="btn-import" class="btn-backup">📥 復元</button>
        <input id="import-file" type="file" accept=".json" hidden />
      </div>
      <div id="month-filter" class="month-filter"></div>

      <div id="history-empty" class="empty-state" hidden>
        <p>まだ記録がありません。<br />毎朝の記録を始めましょう！</p>
      </div>
      <ul id="history-list" class="history-list"></ul>
      <div id="photo-grid" class="photo-grid" hidden></div>
    </div>
  </div>

  <!-- ボトムナビ -->
  <nav class="bottom-nav" hidden>
    <button class="nav-item active" data-screen="record">
      <span class="nav-icon">📝</span>
      <span class="nav-label">記録</span>
    </button>
    <button class="nav-item" data-screen="history">
      <span class="nav-icon">📖</span>
      <span class="nav-label">履歴</span>
    </button>
  </nav>

  <!-- 詳細モーダル -->
  <div id="detail-modal" class="modal" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-card">
      <button class="modal-close">✕</button>
      <p id="modal-date" class="modal-date"></p>
      <img id="modal-photo" hidden />
      <div class="modal-no-photo" id="modal-no-photo" hidden>📷 写真なし</div>
      <p id="modal-weight" class="modal-weight"></p>
      <div class="modal-comments">
        <div class="modal-times-row">
          <div class="modal-comment" id="modal-wake" hidden>
            <span class="modal-comment-icon">⏰</span>
            <span id="modal-wake-text"></span>
          </div>
          <div class="modal-comment" id="modal-sleep" hidden>
            <span class="modal-comment-icon">🛏</span>
            <span id="modal-sleep-text"></span>
          </div>
        </div>
        <div class="modal-comment" id="modal-morning" hidden>
          <span class="modal-comment-icon">🌅</span>
          <span id="modal-morning-text"></span>
        </div>
        <div class="modal-comment" id="modal-evening" hidden>
          <span class="modal-comment-icon">🌙</span>
          <span id="modal-evening-text"></span>
        </div>
      </div>
      <button id="modal-edit" class="btn-edit">編集する</button>
      <button id="modal-delete" class="btn-delete">削除</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js?v=24');
    }
  </script>
</body>
</html>
